
name: Build Smart Attendance APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q SmartAttendance_AndroidStudio_Project.zip -d source

      - name: Build APK
        run: |
          cd source/SmartAttendance_AndroidStudio_Project
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-APK
          path: source/SmartAttendance_AndroidStudio_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
